tasks:
  - id: rdo-futura
    url: https://pep.labs.eneva.com.br/rdo-futura
    schedule: "0 12 * * *"
    sender: pep@eneva.com.br
    recipients:
      - ricardo.queen@eneva.com.br
    formats: [png, pdf, html]
    body_formats: [png, html]
    attachment_formats: [pdf]
    render:
      wait_selector: 'text=Margem Bruta'
      wait_end_selector: 'footer, [data-testid="stFooter"]'
      wait_end_timeout: 30000
      extra_seconds: 5
      viewport_width: 1920
      viewport_height: 8000
      scroll_steps: 10
      scroll_step_px: 500
    subject_template: "RDO Futura — {date}"
