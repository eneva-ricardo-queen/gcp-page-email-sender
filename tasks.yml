tasks:
  - id: rd-futura
    url: https://pep.labs.eneva.com.br/rd-futura
    schedule: "0 12 * * *"
    sender: pep@eneva.com.br
    recipients:
      - marcos.vinicius@eneva.com.br
      - katarine.melo@eneva.com.br
      - joao.rafael@eneva.com.br
      - felipe.nazare@eneva.com.br
      - ricardo.queen@eneva.com.br
    formats: [png, pdf]
    body_formats: [png]
    attachment_formats: [pdf]
    body_text_before: "Segue o Relatório Diário de Futura referente a {date}."
    body_text_after: "Dúvidas? Contate o time de Portfólio em pep@eneva.com.br."
    render:
      wait_selector: ''
      validate_text: 'Margem Bruta'
      wait_end_selector: 'footer, [data-testid="stFooter"]'
      wait_end_timeout: 60000
      extra_seconds: 30
      wait_for_chart: true
      chart_timeout: 30000
      dismiss_dialog_text: 'Page not found'
      viewport_height: 2000
      device_scale_factor: 2
    subject_template: "Relatório Diário Futura — {date}"
